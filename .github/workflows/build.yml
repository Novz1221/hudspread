name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
      - run: gradle build --no-daemon

      - name: Inspect Minecraft classes (diagnostic)
        if: always()
        run: |
          JAR=$(find ~/.gradle .gradle -name "minecraft-merged-deobf-*.jar" 2>/dev/null | head -1)
          [ -z "$JAR" ] && JAR=$(find ~/.gradle .gradle -name "minecraft-merged.jar" 2>/dev/null | head -1)
          {
            echo "##### $JAR"
            for C in 'net.minecraft.client.gui.Hud' 'net.minecraft.client.renderer.state.gui.GuiRenderState' 'net.minecraft.client.renderer.GuiRenderer' 'net.minecraft.client.renderer.texture.SpriteContents$AnimationState' 'net.minecraft.client.renderer.texture.TextureAtlas' 'net.minecraft.client.Minecraft' 'net.minecraft.client.renderer.GameRenderer' 'com.mojang.blaze3d.pipeline.RenderTarget'; do
              echo "--- $C"
              javap -p -cp "$JAR" "$C" 2>/dev/null | grep -iE "class |interface |screen|render|extract|resize|framebuffer|target|animation|tick|upload|setScreen|gui" | cut -c1-230 || true
            done
            echo "--- classes with Gui/Hud/RenderTarget in name"
            unzip -l "$JAR" | awk '{print $4}' | grep -iE "gui/Hud|GuiRender|RenderTarget|TextureTarget|renderpearl" | head -60
          } > inspect.txt 2>&1 || true
          cat inspect.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspect
          path: inspect.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hudspread
          path: build/libs/*.jar
